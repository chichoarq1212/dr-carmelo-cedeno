            "comites-internacionales": "AMxu72vqgpQYYYtoaVl7wnOm_xS5GygiOzsSS5AqP8tJdaXOnYAtJ6wzueLhXu3qkp67axSsN8rlSI4_VotNGDFcKUJ2WgLFjlsKOSJfd4ov-H1FvtapSciBYD13q8z_J1CwRb6bUizZzBpYyky1LYHIbFgXXkM1srxMlOUoSXNdKzitcm8jeALeJ22keiU2"
          }
          patterns = [
            "https://sites.google.com/sitesv-images-rt/{id}=w1280",
            "https://lh7-rt.googleusercontent.com/rd-sitesv-images-rt/{id}=w1280",
            "https://lh7-rt.googleusercontent.com/rd-sitesv-images-rt/{id}",
            "https://lh3.googleusercontent.com/sitesv-images-rt/{id}=w1280",
            "https://lh7-us.googleusercontent.com/sitesv-images-rt/{id}=w1280",
          ]
          headers = {
            "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36",
            "Referer": source,
            "Origin": "https://sites.google.com",
            "Accept": "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
            "Accept-Language": "es-EC,es;q=0.9,en;q=0.8",
          }
          session = requests.Session()
          session.headers.update(headers)
          try:
            session.get(source, timeout=30)
          except requests.RequestException as e:
            print("Page preflight warning:", e)
          dest = Path("public/assets/org-logos")
          dest.mkdir(parents=True, exist_ok=True)
          failures = []
          for slug, image_id in logos.items():
            errors = []
            for pattern in patterns:
              url = pattern.format(id=image_id)
              try:
                r = session.get(url, timeout=45, allow_redirects=True)
                if r.status_code != 200 or not r.headers.get("Content-Type", "").lower().startswith("image/"):
                  errors.append(f"{r.status_code} {r.headers.get('Content-Type')} {r.url}")
                  continue
                im = Image.open(BytesIO(r.content)).convert("RGBA")
                im.load()
                # Trim only the outer blank/transparent margin; preserve the actual emblem.
                alpha = im.getchannel("A")
                bbox = alpha.getbbox()
                if bbox:
                  im = im.crop(bbox)
                else:
                  rgb = im.convert("RGB")
                  corner = rgb.getpixel((0, 0))
                  bg = Image.new("RGB", rgb.size, corner)
                  diff = ImageChops.difference(rgb, bg).convert("L").point(lambda p: 255 if p > 24 else 0)
                  box = diff.getbbox()
                  if box and box != (0, 0, rgb.width, rgb.height):
                    pad = max(4, int(min(rgb.size) * 0.015))
                    box = (max(0, box[0]-pad), max(0, box[1]-pad), min(rgb.width, box[2]+pad), min(rgb.height, box[3]+pad))
                    im = im.crop(box)
                out = dest / f"{slug}.webp"
                im.save(out, "WEBP", quality=96, method=6)
                print(f"OK {slug}: {im.width}x{im.height}, {out.stat().st_size} bytes")
                break
              except Exception as e:
                errors.append(str(e))
            else:
              failures.append(slug)
              print(f"FAILED {slug}: {' | '.join(errors)}", file=sys.stderr)
          if failures:
            print("Could not retrieve logos:", ", ".join(failures), file=sys.stderr)
            sys.exit(1)
          print(f"SUCCESS: copied all {len(logos)} original logos to local assets.")
          PY
      - name: Commit the logo image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/org-logos/*.webp
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Copy original organization logos into local assets"
            git push
          fi
