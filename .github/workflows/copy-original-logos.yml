name: Copy original organization logos from Google Sites

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/copy-original-logos.yml'
      - 'public/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and crop the original image files
        run: |
          python -m pip install --disable-pip-version-check requests Pillow
          python - <<'PY'
