name: Copy original organization logos

on:
  workflow_dispatch:

concurrency:
  group: copy-original-organization-logos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  copy-original-logos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright pillow cairosvg
          python -m playwright install --with-deps chromium

      - name: Copy the original logos from Google Sites
        run: python scripts/import-original-org-logos.py

      - name: Commit the local logo images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/org-logos/*.webp src/index.js
          if git diff --cached --quiet; then
            echo "No logo changes to commit."
          else
            git commit -m "Add original organization logos as local assets"
            # Rebase over any site or deployment commits created while the
            # image extraction job was running, then retry the push safely.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying after fetching main."
              sleep 3
            done
            echo "Unable to push the copied logos after three attempts."
            exit 1
          fi
